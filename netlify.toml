# Pretty URLs - serve extensionless URLs from matching .html files.
[[redirects]]
  from = "/:url"
  to = "/:url.html"
  status = 200
  force = false

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' https://ghostesp.net https://raw.githubusercontent.com https://gesp.fuckyourcdn.com https://www.youtube.com https://i.ytimg.com https://static.wixstatic.com https://ae-pic-a1.aliexpress-media.com https://avatars.githubusercontent.com https://lilygo.cc https://media-cdn.seeedstudio.com https://shop.m5stack.com https://cdn.shopify.com https://www.elecrow.com https://*.tile.openstreetmap.org data:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src https://www.youtube.com; connect-src 'self' https://raw.githubusercontent.com https://gesp.fuckyourcdn.com https://api.github.com https://cdn.spookytools.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://discord.com https://ingesteer.services-prod.nsvcs.net https://super-breeze-c8cd.flavouredjelly.workers.dev https://fragrant-flower-ba0b.creepersbeast.workers.dev https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

# Cache strategy: pages revalidate every load; versioned static assets
# (css/*.css?v=N, js/*.js?v=N) are immutable. Bump the ?v= query in the
# HTML <link>/<script> tags whenever css/js change.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
