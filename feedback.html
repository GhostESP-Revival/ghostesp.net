  <style>
    .feedback-section {
      padding: 0 0 60px;
      position: relative;
      z-index: 1;
    }

    /* Unboxed so labels and inputs share the hero title's left line */
    .feedback-section .feedback-container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0 var(--spacing);
    }
    .feedback-container form,
    .feedback-container #form-status {
      max-width: 700px;
    }

    .feedback-container h2 {
      font-family: var(--font-sans);
      font-weight: 500;
      text-transform: none;
      letter-spacing: -0.04em;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: var(--font-mono);
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group select option {
      background: #0a0a0a;
      color: var(--text);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #00ff80;
      box-shadow: 0 0 0 2px rgba(0, 255, 128, 0.12);
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }

    .form-group small {
      display: block;
      margin-top: 0.3rem;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .submit-btn {
      width: 100%;
      padding: 1rem 2rem;
      background: #00ff80;
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 1rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 255, 255, 0.2);
    }

    #form-status {
      margin-top: 1.5rem;
      text-align: left;
      font-weight: 500;
      font-family: var(--font-mono);
    }

    #form-status.success {
      color: #4caf50;
    }

    #form-status.error {
      color: #f44336;
    }

    @media (max-width: 768px) {
      .feedback-section {
        padding: 0 0 40px;
      }

      .feedback-section .feedback-container {
        padding: 0 var(--spacing);
      }

      .form-group input[type="text"],
      .form-group input[type="email"],
      .form-group select,
      .form-group textarea {
        font-size: 16px;
      }

      .feedback-container h2 {
        font-size: 1.5rem;
      }
    }
  </style>

<body class="polished">
  <a href="#main-content" class="skip-link">Skip to content</a>
  <canvas id="dotTerrain"></canvas>

  <nav id="nav"><noscript><a href="/">Home</a> <a href="boards.html">Boards</a> <a href="flasher.html">Flasher</a> <a href="dashboard.html">Dashboard</a> <a href="blog.html">Blog</a> <a href="https://docs.ghostesp.net">Docs</a></noscript></nav>

  <!-- Feedback Section -->
  <main id="main-content">
    <header class="page-hero" style="padding-bottom: 24px;">
      <div class="container">
        <span class="editorial-eyebrow">Tell us what broke</span>
        <h1>Submit feedback.</h1>
        <p class="editorial-lede">Bug reports, feature requests, and board support requests.</p>
      </div>
    </header>
    <section class="feedback-section" style="padding-top: 0;">
      <div class="feedback-container">
        <form id="feedback-form" class="feedback-form" name="feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field">
          <!-- bot protection -->
          <p style="display:none;">
            <label>
              Don't fill this out if you're human: <input name="bot-field" />
            </label>
          </p>
          <input type="hidden" name="form-name" value="feedback" />

          <div class="form-group">
            <label for="feedback-topic">Feedback Area</label>
            <select id="feedback-topic" name="topic" required>
              <option value="" disabled selected>Select A Feedback Topic...</option>
              <option value="GhostESP: Display Support">GhostESP: Display Support</option>
              <option value="GhostESP: New Feature Request">GhostESP: New Feature Request</option>
              <option value="GhostESP: Essential Bug Fix">GhostESP: Essential Bug Fix</option>
              <option value="GhostESP: What You Like">GhostESP: What You Like</option>
              <option value="GhostESP: What You Dislike">GhostESP: What You Dislike</option>
              <option value="GhostESP: Other">GhostESP: Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="feedback-message">Message</label>
            <textarea id="feedback-message" name="message" rows="6" required placeholder="Select a topic first..."></textarea>
          </div>

          <div class="form-group">
            <label for="user-contact">Contact Info (Optional)</label>
            <input type="text" id="user-contact" name="contact" placeholder="Your Discord username or other contact info...">
            <small>Helps us follow up if we have questions.</small>
          </div>

          <button type="submit" class="submit-btn">Send Feedback</button>
        </form>
        <div id="form-status"></div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="https://discord.gg/5cyNmUMgwh" target="_blank" rel="noopener" class="icon-link" title="Discord">
          <i class="bi bi-discord"></i>

        <a href="https://github.com/GhostESP-Revival/GhostESP" target="_blank" rel="noopener" class="icon-link" title="GitHub">

        <a href="https://instagram.com/ghostesprevival" target="_blank" rel="noopener" class="icon-link" title="Instagram">

    </div>
    </div>

  <script>
    // dynamic placeholder based on selected topic
    const topicSelect = document.getElementById('feedback-topic');
    const messageTextarea = document.getElementById('feedback-message');

    const placeholderMap = {
      "": "Select a topic first...",
      "GhostESP: Display Support": "Describe the display issue or suggestion (e.g., specific board, layout, feature)...",
      "GhostESP: New Feature Request": "Describe the new feature you'd like to see...",
      "GhostESP: Essential Bug Fix": "Describe the bug, how to reproduce it, and why it's essential...",
      "GhostESP: What You Like": "Describe what works well...",
      "GhostESP: What You Dislike": "Tell us what you don't like or find frustrating...",
      "GhostESP: Other": "Please provide details about your feedback..."
    };

    function updatePlaceholder() {
      const selectedTopic = topicSelect.value;
      messageTextarea.placeholder = placeholderMap[selectedTopic] || placeholderMap[""];
    }

    topicSelect.addEventListener('change', updatePlaceholder);
    updatePlaceholder();
  </script>
  <script src="js/cookie-consent.js?v=2" defer></script>
